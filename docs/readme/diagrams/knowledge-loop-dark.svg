<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img"><rect width="1200" height="500" fill="#0F0F0F"/><g font-family="Onest,Arial,sans-serif"><text x="40" y="55" font-size="14" letter-spacing="2" fill="#BDBDBD">ВОПРОС СТАЖЁРА → ЗНАНИЕ КОМАНДЫ</text><rect x="40" y="96" width="300" height="94" fill="#BADAFB"/><text x="60" y="128" font-size="15" font-weight="700" fill="#000">01 / КОНТЕКСТ</text><text x="60" y="159" font-size="15" fill="#000">Роль, план и доступные знания</text><rect x="450" y="96" width="300" height="94" fill="#EFE7FC"/><text x="470" y="128" font-size="15" font-weight="700" fill="#000">02 / AI-АГЕНТ</text><text x="470" y="159" font-size="15" fill="#000">Поиск → ответ с источником</text><rect x="860" y="96" width="300" height="94" fill="#BADAFB"/><text x="880" y="128" font-size="15" font-weight="700" fill="#000">03 / ЕСЛИ ОТВЕТА НЕТ</text><text x="880" y="159" font-size="15" fill="#000">Эксперт → черновик вопроса</text><rect x="860" y="260" width="300" height="94" fill="#D9F9E6"/><text x="880" y="292" font-size="15" font-weight="700" fill="#000">04 / ЧЕЛОВЕК РЕШАЕТ</text><text x="880" y="323" font-size="15" fill="#000">Подтверждение → ответ эксперта</text><rect x="450" y="260" width="300" height="94" fill="#D9F9E6"/><text x="470" y="292" font-size="15" font-weight="700" fill="#000">05 / БАЗА РАСТЁТ</text><text x="470" y="323" font-size="15" fill="#000">Черновик статьи → «Ок» автора</text><rect x="40" y="260" width="300" height="94" fill="#BADAFB"/><text x="60" y="292" font-size="15" font-weight="700" fill="#000">06 / СЛЕДУЮЩИЙ ВОПРОС</text><text x="60" y="323" font-size="15" fill="#000">Ответ уже есть в базе команды</text><g fill="none" stroke="#BDBDBD" stroke-width="2"><path d="M340 143h110m-12-6 12 6-12 6M750 143h110m-12-6 12 6-12 6M1010 190v70m-6-12 6 12 6-12M860 307H750m12-6-12 6 12 6M450 307H340m12-6-12 6 12 6"/></g><path d="M40 397H1160" stroke="#3D3D3D"/><text x="40" y="437" font-size="17" fill="#F3F3F3">Права в коде · действия через инструменты и адаптеры · PostgreSQL / Redis</text><text x="40" y="471" font-size="15" fill="#BDBDBD">Заявка: черновик → подтверждение человека → сервис → сохранённая квитанция</text></g></svg>